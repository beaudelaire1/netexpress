<div class="form-field{% if field.errors %} has-error{% endif %}">
<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="field-required">(obligatoire)</span>{% else %} <span class="field-optional">(facultatif)</span>{% endif %}</label>
{{ field }}{% if field.help_text %}<span class="helptext" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</span>{% endif %}{{ field.errors }}
</div>
