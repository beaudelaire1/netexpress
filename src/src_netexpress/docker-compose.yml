x-app: &app
  build: .
  restart: unless-stopped
  environment: &environment
    DJANGO_SETTINGS_MODULE: netexpress.settings.prod
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
    SITE_URL: ${SITE_URL:?}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    DATABASE_URL: postgresql://netexpress:${POSTGRES_PASSWORD:?}@db:5432/netexpress
    REDIS_URL: redis://redis:6379/0
    BREVO_API_KEY: ${BREVO_API_KEY:?}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?}
    DEFAULT_FROM_NAME: ${DEFAULT_FROM_NAME:-Nettoyage Express}
    CONTACT_RECEIVER_EMAIL: ${CONTACT_RECEIVER_EMAIL:?}
    CONTACT_CC_EMAIL: ${CONTACT_CC_EMAIL:-}
    TASK_NOTIFICATION_EMAIL: ${TASK_NOTIFICATION_EMAIL:?}
    TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?}
    TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?}
    CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
    CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
    CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    PORT: "8000"
  volumes:
    - private_media:/app/private_media
    - public_media:/app/media
  security_opt:
    - no-new-privileges:true

services:
  web:
    <<: *app
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  worker:
    <<: *app
    command: ["celery", "-A", "netexpress", "worker", "--loglevel=info", "--concurrency=2", "-Q", "celery,notifications,documents,messaging"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A netexpress inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 60s
      timeout: 10s
      start_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: netexpress
      POSTGRES_USER: netexpress
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netexpress -d netexpress"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  private_media:
  public_media:
