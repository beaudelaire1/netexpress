name: Task notifications

on:
  push:
    branches:
      - for_prod
    paths:
      - 'src/src_netexpress/tasks/**'
      - 'src/src_netexpress/tests/test_task_client_notifications.py'
      - 'src/src_netexpress/tests/test_task_notification_delivery.py'
      - '.github/workflows/task-notifications.yml'
  pull_request:
    paths:
      - 'src/src_netexpress/tasks/**'
      - 'src/src_netexpress/tests/test_task_client_notifications.py'
      - 'src/src_netexpress/tests/test_task_notification_delivery.py'
      - '.github/workflows/task-notifications.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/src_netexpress

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/src_netexpress/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Django system check
        run: python manage.py check --settings=netexpress.settings.test

      - name: Task notification tests
        run: >-
          pytest
          tests/test_task_client_notifications.py
          tests/test_task_notification_delivery.py
          -q
