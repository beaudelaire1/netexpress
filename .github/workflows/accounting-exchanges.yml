name: Accounting and production critical paths

on:
  pull_request:
    paths:
      - 'src/src_netexpress/accounting/**'
      - 'src/src_netexpress/core/private_files.py'
      - 'src/src_netexpress/core/management/commands/deploy_migrate.py'
      - 'src/src_netexpress/deploy/**'
      - 'src/src_netexpress/netexpress/settings/**'
      - 'src/src_netexpress/Dockerfile'
      - 'src/src_netexpress/start.sh'
      - 'src/src_netexpress/.env.example'
      - 'src/src_netexpress/templates/accounting/**'
      - 'src/src_netexpress/templates/pdf/**'
      - 'src/src_netexpress/templates/emails/accounting_exchange_notification.html'
      - 'src/src_netexpress/static/css/accounting-exchanges.css'
      - 'src/src_netexpress/static/css/accounting-search.css'
      - 'src/src_netexpress/static/css/accounting-filters.css'
      - 'src/src_netexpress/static/css/pdf*.css'
      - 'src/src_netexpress/static/js/accounting-exchanges.js'
      - 'src/src_netexpress/tests/test_accounting_*.py'
      - 'src/src_netexpress/tests/test_production_readiness.py'
      - '.github/workflows/accounting-exchanges.yml'
      - '.github/workflows/production-readiness.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: netexpress
          POSTGRES_USER: netexpress
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netexpress -d netexpress"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: netexpress.settings.test
      DJANGO_SECRET_KEY: 'Q7!4vN2#zL9@xK6$pR1&mT8*eW5_yC3+uF0=hJ7%qS4!dB9'
      SITE_URL: https://example.test
      DATABASE_URL: postgresql://netexpress:ci-password@127.0.0.1:5432/netexpress
      REDIS_URL: redis://127.0.0.1:6379/0
      BREVO_API_KEY: ci-brevo-key
      DEFAULT_FROM_EMAIL: ci@example.test
      TURNSTILE_SITE_KEY: ci-turnstile-site
      TURNSTILE_SECRET_KEY: ci-turnstile-secret
      COMPANY_SIRET: '000 000 000 00000'
      BANK_ACCOUNT_NAME: NetExpress CI
      BANK_ACCOUNT_NUMBER: GB82 WEST 1234 5698 7654 32
      COMPANY_BIC: DEUTDEFF

    steps:
      - name: Checkout pull request head
        shell: bash
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.head.sha }}"
          git checkout --detach FETCH_HEAD

      - name: Python environment
        shell: bash
        run: |
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install -r src/src_netexpress/requirements/dev.txt

      - name: Install WeasyPrint system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libjpeg62-turbo libopenjp2-7

      - name: Django checks
        shell: bash
        working-directory: src/src_netexpress
        run: |
          python3 manage.py makemigrations --check --dry-run
          python3 manage.py check

      - name: Production security check
        shell: bash
        working-directory: src/src_netexpress
        env:
          DJANGO_SETTINGS_MODULE: netexpress.settings.prod
        run: python3 manage.py check --deploy --fail-level WARNING

      - name: Accounting and production tests
        shell: bash
        working-directory: src/src_netexpress
        run: pytest tests/test_accounting_*.py tests/test_production_readiness.py -q

      - name: Production Docker build
        shell: bash
        working-directory: src/src_netexpress
        run: docker build --pull -t netexpress-production-readiness .
