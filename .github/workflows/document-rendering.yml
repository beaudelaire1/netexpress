name: Document rendering

on:
  pull_request:
    paths:
      - "src/src_netexpress/core/services/pdf_service.py"
      - "src/src_netexpress/core/services/pdf_generator.py"
      - "src/src_netexpress/devis/**"
      - "src/src_netexpress/factures/**"
      - "src/src_netexpress/static/css/pdf.css"
      - "src/src_netexpress/static/js/quote_admin.js"
      - "src/src_netexpress/templates/devis/**"
      - "src/src_netexpress/templates/pdf/**"
      - "src/src_netexpress/tests/test_document_rendering.py"
      - ".github/workflows/document-rendering.yml"
  push:
    branches: [main]
    paths:
      - "src/src_netexpress/core/services/pdf_service.py"
      - "src/src_netexpress/core/services/pdf_generator.py"
      - "src/src_netexpress/devis/**"
      - "src/src_netexpress/factures/**"
      - "src/src_netexpress/static/css/pdf.css"
      - "src/src_netexpress/static/js/quote_admin.js"
      - "src/src_netexpress/templates/devis/**"
      - "src/src_netexpress/templates/pdf/**"
      - "src/src_netexpress/tests/test_document_rendering.py"
      - ".github/workflows/document-rendering.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-document-rendering-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: src/src_netexpress/requirements/*.txt

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/src_netexpress/requirements/dev.txt

      - name: Django system check
        working-directory: src/src_netexpress
        run: python manage.py check

      - name: Document rendering tests
        working-directory: src/src_netexpress
        run: pytest tests/test_document_rendering.py -q
